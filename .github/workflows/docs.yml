name: Publish BigBigBob’s Personal Blog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.11.20'
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run --locked python scripts/build_site.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .build/preview/bob-tech-notes/
      - uses: actions/deploy-pages@v5
        id: deployment
