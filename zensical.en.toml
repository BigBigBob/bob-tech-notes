[project]
site_name = "Shi’an Pages"
site_url = "https://shianpages.com/en/"
site_description = "Notes on technology and everyday life, from things I’ve built and lessons I’ve learned to reflections along the way."
site_author = "BigBigBob"
repo_url = "https://github.com/BigBigBob/bob-tech-notes"
repo_name = "BigBigBob/bob-tech-notes"
edit_uri = "edit/main/translations/en/"
copyright = 'BigBigBob · Original content is licensed under <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>.'
docs_dir = "translations/en"
site_dir = ".build/en"
nav = [
  { "Home" = "README.md" },
  { "Tech Blog" = [
    "tech/README.md",
    { "Frontend Development" = [
      { "JavaScript" = ["frontend/javascript/README.md", { "JavaScript Fundamentals" = "frontend/javascript/basics.md" }] },
      { "TypeScript" = ["frontend/typescript/README.md", { "TypeScript Fundamentals" = "frontend/typescript/basics.md" }] },
    ] },
    { "DevOps" = [
      { "Docker" = ["devops/docker/README.md", { "Docker Fundamentals" = "devops/docker/basics.md" }] },
    ] },
  ] },
]

[project.theme]
custom_dir = "overrides"
language = "en"
features = ["navigation.indexes", "navigation.tabs", "content.code.copy"]
